---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: pg-cluster-vault-ca
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
type: Opaque
data:
  ca.crt: 
---
# Source: cngp-cluster/templates/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  instances: 3
  postgresql:
    extensions:
      - name: pgvector
  superuserSecret:
    name: pg-cluster-postgres-role
  managed:
    roles:
      - name: app
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-cluster-app-role
        inRoles:
          - pg_monitor
          - pg_signal_backend
  bootstrap:
    initdb:
      database: mangalodon
      owner: admin
      secret:
        name: pg-cluster-db-owner-role
  storage:
    storageClass: local-path
    size: 5Gi
  walStorage:
    storageClass: local-path
    size: 1Gi
---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: pg-cluster
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
spec:
  vaultConnectionRef: pg-cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mangalodon-postgres-dev
    serviceAccount: postgres
---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: pg-cluster
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
spec:
  address: https://192.168.1.10:8200
  caCertSecretRef: pg-cluster-vault-ca
---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pg-cluster-postgres-role
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
spec:
  vaultAuthRef: pg-cluster
  mount: kv
  type: kv-v2
  path: mangalodon/dev/postgres/user/postgres
  refreshAfter: 10m
  destination:
    name: pg-cluster-postgres-role
    labels:
      cnpg.io/reload: "true"
    create: true
    overwrite: true
---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pg-cluster-db-owner-role
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
spec:
  vaultAuthRef: pg-cluster
  mount: kv
  type: kv-v2
  path: mangalodon/dev/postgres/user/admin
  refreshAfter: 10m
  destination:
    name: pg-cluster-db-owner-role
    labels:
      cnpg.io/reload: "true"
    create: true
    overwrite: true
---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pg-cluster-app-role
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
spec:
  vaultAuthRef: pg-cluster
  mount: kv
  type: kv-v2
  path: mangalodon/dev/postgres/user/app
  refreshAfter: 10m
  destination:
    name: pg-cluster-app-role
    labels:
      cnpg.io/reload: "true"
    create: true
    overwrite: true
---
# Source: cngp-cluster/templates/vaultsecret.yaml
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pg-cluster-url
  namespace: default
  labels:
    helm.sh/chart: cngp-cluster-0.0.1
    app.kubernetes.io/name: cngp-cluster
    app.kubernetes.io/instance: pg-cluster
    app.kubernetes.io/managed-by: Helm
spec:
  vaultAuthRef: pg-cluster
  mount: kv
  type: kv-v2
  path: mangalodon/dev/postgres/user/admin
  refreshAfter: 10m
  destination:
    name: pg-cluster-url
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        rw:
          text: |
            {{- printf "postgresql://%s:%s@pg-cluster-rw.default.svc:5432/mangalodon" (get .Secrets "username") (get .Secrets "password") -}}
        ro:
          text: |
            {{- printf "postgresql://%s:%s@pg-cluster-ro.default.svc:5432/mangalodon" (get .Secrets "username") (get .Secrets "password") -}}
