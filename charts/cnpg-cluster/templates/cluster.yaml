{{- if .Values.initdb.initSql }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (include "cnpg-cluster.fullname" .) .Values.clusterName }}-initsql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
data:
  init.sql: {{ .Values.initdb.initSql }}
---
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ default (include "cnpg-cluster.fullname" .) .Values.clusterName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: {{ .Values.version }}
  instances: {{ .Values.replicas }}
  {{- if .Values.extensions }}
  postgresql:
    extensions:
    {{- range .Values.extensions }}
      - name: {{ . }}
    {{- end }}
  {{- end }}
  superuserSecret:
    name: {{ default (include "cnpg-cluster.fullname" .) .Values.clusterName }}-postgres-role
  {{- if .Values.roles }}
  managed:
    roles:
    {{- range $key, $value := .Values.roles }}
      - name: {{ $value.username }}
        ensure: present
        login: {{ $value.login }}
        superuser: {{ $value.superuser }}
        passwordSecret:
          name: {{ $.Release.Name }}-{{ $key }}-role
        {{- if $value.inRoles }}
        inRoles:
        {{- range $value.inRoles }}
          - {{ . }}
        {{- end }}
        {{- end }}
    {{- end }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.initdb.database }}
      owner: {{ .Values.initdb.owner.username }}
      secret:
        name: {{ default (include "cnpg-cluster.fullname" .) .Values.clusterName }}-db-owner-role
      {{- if .Values.initdb.initSql }}
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: {{ default (include "cnpg-cluster.fullname" .) .Values.clusterName }}-initsql
            key: init.sql
      {{- end }}
  storage:
    storageClass: {{ .Values.storage.className }}
    size: {{ .Values.storage.size }}
  {{- if .Values.walStorage.enabled }}
  walStorage:
    storageClass: {{ .Values.walStorage.className }}
    size: {{ .Values.walStorage.size }}
  {{- end }}
