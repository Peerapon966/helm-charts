# Name of PostgreSQL cluster to create. Default to chart's fullname if not specified.
clusterName:

# PostgreSQL major version to deploy.
version: 18

# Number of PostgreSQL pod replicas to run in the cluster.
replicas: 3

# Additional PostgreSQL extension enabled on the instance.
extensions:
  - pgvector

postgres:
  # Vault secret path used to retrieve privileged postgres role credentials.
  vaultSecretPath:

initdb:
  # Name of the database created during initialization.
  database:
  owner:
    # Default database owner username created during bootstrap.
    username:
    # Vault secret path storing the database owner's credentials.
    vaultSecretPath:
  # Optional SQL statements executed after the database is initialized, also accept literal block.
  initSql:

# Additional roles to create. You can define multiple entries.
roles:
  # app:
  #   # Role username.
  #   username: app
  #   # Vault secret path for this role's credentials.
  #   vaultSecretPath:
  #   # Whether the role is allowed to log in to PostgreSQL.
  #   login: true
  #   # Whether the role should have superuser privileges.
  #   superuser: false
  #   # Additional PostgreSQL role membership granted to the user.
  #   inRoles:
  #     - pg_monitor
  #     - pg_signal_backend

# Storage settings for the PostgreSQL data volume.
storage:
  # Kubernetes storage class to use for the PostgreSQL persistent volume.
  className: local-path
  # Requested size for the PostgreSQL data volume.
  size: 5Gi

walStorage:
  # Whether to provision a dedicated WAL volume.
  enabled: true
  # Storage class used for the WAL volume.
  className: local-path
  # Requested size for the WAL volume.
  size: 1Gi

# Vault configuration used by the RabbitMQ integration.
vault:
  # Kubernetes auth configuration for Vault login.
  auth:
    # Whether to create the Vault auth.
    create: true
    # Name of Vault auth to create. Default to chart's fullname if not specified.
    name:
    # Name of an existing Vault connection to use.
    connectionRef:
    # Kubernetes auth role name used for Vault login.
    role:
    # Vault Kubernetes auth mount path. Default to "kubernetes" if not specified.
    kubernetesAuthMountPath: kubernetes
    # Kubernetes service account configuration.
    serviceAccount:
      # Whether to create the service account.
      create: true
      # Name of the Kubernetes service account to create (default to chart's fullname if not specified), or the existing service account to use when serviceAccount.create is false.
      name:
  # Name of an existing Vault auth to use; ignored when auth.create is true.
  vaultAuthRef:
  # Vault KV engine configuration.
  kvEngine:
    # Mount path where secrets are stored inside the KV engine.
    mountPath: kv
    # KV engine version in use.
    version: v2
