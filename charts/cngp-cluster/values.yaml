version: 18 # PostgreSQL major version to deploy.
replicas: 3 # Number of PostgreSQL pod replicas to run in the cluster.
extensions: # Additional PostgreSQL extension enabled on the instance.
  - pgvector
postgres:
  vaultSecretPath: # Vault secret path used to retrieve privileged postgres role credentials.
initdb:
  database: # Name of the database created during initialization.
  owner:
    username: admin # Default database owner username created during bootstrap.
    vaultSecretPath: # Vault secret path storing the database owner's credentials.
  initSql: # Optional SQL statements executed after the database is initialized, also accept literal block.
roles: # Additional roles to create. You can define multiple entries.
  # app:
  #   username: app # Role username.
  #   vaultSecretPath: # Vault secret path for this role's credentials.
  #   login: true # Whether the role is allowed to log in to PostgreSQL.
  #   superuser: false # Whether the role should have superuser privileges.
  #   inRoles: # Additional PostgreSQL role membership granted to the user.
  #     - pg_monitor
  #     - pg_signal_backend
storage:
  className: local-path # Storage class used for the PostgreSQL data volume.
  size: 5Gi # Requested size for the primary PostgreSQL data volume.
walStorage:
  enabled: true # Whether to provision a dedicated WAL volume.
  className: local-path # Storage class used for the WAL volume.
  size: 1Gi # Requested size for the WAL volume.
vault:
  connection:
    create: true # Whether to create a Vault connection; set false to use an existing connectionRef.
    server: https://192.168.1.10:8200
    caBundle: 
  connectionRef: # Name of an existing Vault connection to use; ignored when connection.create is true.
  auth:
    serviceAccount:
      create: true # Whether to create a dedicated Vault auth service account.
      name: # Name of the Vault service account to use. Leave empty to use the chart default.
    role: # Kubernetes auth role name used for Vault login.
  kubernetesAuthMountPath: kubernetes # Vault Kubernetes auth mount path.
  kvEngine:
    mountPath: kv # Vault KV mount path where secrets are stored.
    version: v2 # Vault KV engine version in use.
