{{- if and (not .Values.vault.auth.create) (empty .Values.vault.vaultAuthRef) }}
{{- fail "vault.vaultAuthRef is required when vault.auth.create = false" }}
{{- end }}
---
{{- if .Values.vault.auth.create }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ default (include "rabbitmq-cluster.fullname" .) .Values.vault.auth.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rabbitmq-cluster.labels" . | nindent 4 }}
spec:
  vaultConnectionRef: {{ .Values.vault.auth.connectionRef }}
  method: kubernetes
  mount: {{ default "kubernetes" .Values.vault.auth.kubernetesAuthMountPath }}
  kubernetes:
    role: {{ .Values.vault.auth.role }}
    serviceAccount: {{ default (include "rabbitmq-cluster.fullname" .) .Values.clusterName }}-server
---
{{- end }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ default (include "rabbitmq-cluster.fullname" .) .Values.clusterName }}-url
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rabbitmq-cluster.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ ternary .Release.Name .Values.vault.vaultAuthRef .Values.vault.auth.create }}
  mount: {{ .Values.vault.kvEngine.mountPath }}
  type: kv-{{ .Values.vault.kvEngine.version }}
  path: {{ .Values.vaultSecretPath.defaultUser }}
  refreshAfter: 10m
  rolloutRestartTargets:
    - name: {{ default (include "rabbitmq-cluster.fullname" .) .Values.clusterName }}-server
      kind: StatefulSet
  destination:
    name: {{ default (include "rabbitmq-cluster.fullname" .) .Values.clusterName }}-url
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        host:
          text: |
            {{ `{{- printf "amqp://%s:%s@` }}{{ default (include "rabbitmq-cluster.fullname" .) .Values.clusterName }}.{{ .Release.Namespace }}.svc.cluster.local:{{ ternary "5671" "5672" .Values.tlsEnabled }}{{ `" (get .Secrets "username") (get .Secrets "password") -}}` }}