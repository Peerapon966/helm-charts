# Name of RabbitMQ cluster to create. Default to chart's fullname if not specified.
clusterName:

# Number of RabbitMQ pod replicas to run in the cluster.
replicas: 3

# Enable TLS for RabbitMQ listener and client connections.
tlsEnabled: false

# Paths in Vault used by the RabbitMQ chart for credentials and PKI configuration.
vaultSecretPath:
  # Path to the default RabbitMQ user credentials stored in Vault.
  defaultUser:
  # Path to the PKI issuer used for RabbitMQ certificate issuance.
  pkiIssuer:

# RabbitMQ resource definitions to create in the cluster.
resources:
  # Virtual hosts exposed by the RabbitMQ broker.
  vhost:
    - name:
  # RabbitMQ queues to provision inside the configured virtual hosts.
  queue:
    - name:
      vhost:
      type:

# Storage settings for the RabbitMQ data volume.
storage:
  # Kubernetes storage class to use for the RabbitMQ persistent volume.
  className: local-path
  # Requested size for the RabbitMQ data volume.
  size: 5Gi

# Vault configuration used by the RabbitMQ integration.
vault:
  # Vault server URL.
  server: https://192.168.1.10:8200
  # Secret name containing the Vault CA certificate under the ca.crt key; must be in the same namespace as the release.
  caBundleSecretRef:
  # Kubernetes auth configuration for Vault login.
  auth:
    # Whether to create the Vault auth.
    create: true
    # Name of Vault auth to create. Default to chart's fullname if not specified.
    name:
    # Name of an existing Vault connection to use.
    connectionRef:
    # Kubernetes auth role name used for Vault login.
    role:
    # Vault Kubernetes auth mount path. Default to "kubernetes" if not specified.
    kubernetesAuthMountPath: kubernetes
  # Name of an existing Vault auth to use; ignored when auth.create is true.
  vaultAuthRef:
  # Vault KV engine configuration.
  kvEngine:
    # Mount path where secrets are stored inside the KV engine.
    mountPath: kv
    # KV engine version in use.
    version: v2
